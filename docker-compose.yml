services:
  db:
    image: postgres:16-alpine
    container_name: evotec-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evotec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evotec_secret}
      POSTGRES_DB: ${POSTGRES_DB:-evotec}
    volumes:
      - evotec_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-evotec} -d ${POSTGRES_DB:-evotec}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  evotec_pgdata:
